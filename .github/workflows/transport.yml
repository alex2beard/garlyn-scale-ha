name: ESP transport tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-protocol:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile protocol regression test
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I.
          components/garlyn_scale_ble/garlyn_delivery.cpp
          components/garlyn_scale_ble/garlyn_protocol.cpp
          tests_cpp/test_garlyn_protocol.cpp
          -o /tmp/test_garlyn_protocol
      - name: Run protocol regression test
        run: /tmp/test_garlyn_protocol

  compile-esphome:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/platformio
            ~/.platformio
          key: esphome-2026.5.3-esp32dev-${{ runner.os }}
      - name: Install ESPHome
        run: python -m pip install esphome==2026.5.3
      - name: Compile synthetic ESP32 firmware
        run: esphome compile tests/esphome/garlyn_scale_ble.yaml
